# ===== PhysiScene Java 主后端（第一周骨架）=====
spring.application.name=physicene-backend
server.port=8080

# Actuator：健康检查与指标（SRS 4.4）
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Python AI 服务地址（Day 5 Feign 打通；Docker 化后改为 http://python-ai:8000）
ai.service.url=http://localhost:8000

# Jackson：未知字段不报错（SRS 技术约定）
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===== 第三周：MySQL + JPA =====
spring.datasource.url=jdbc:mysql://localhost:3306/physicene?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT（开发用密钥写死在此；生产改 .env 注入，SRS 4.2：密钥不进代码库）
jwt.secret=physicene-dev-secret-0123456789abcdef-0123456789abcdef-0123456789
jwt.expiration-seconds=7200
