# ===== PhysiScene Java 主后端（第一周骨架）=====
spring.application.name=physicene-backend
server.port=8080

# Actuator：健康检查与指标（SRS 4.4）
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Python AI 服务地址（Day 5 Feign 打通；Docker 化后改为 http://python-ai:8000）
ai.service.url=http://localhost:8000

# Jackson：未知字段不报错（SRS 技术约定）
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===== 第三周：MySQL + JPA =====
spring.datasource.url=jdbc:mysql://localhost:3306/physicene?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# JWT（开发默认值；生产用环境变量 JWT_SECRET 覆盖，SRS 4.2：密钥不进代码库）
jwt.secret=${JWT_SECRET:physicene-dev-secret-0123456789abcdef-0123456789abcdef-0123456789}
jwt.expiration-seconds=7200

# Java↔Python 内部共享密钥（与 python-ai-service/.env 的 INTERNAL_KEY 一致；生产用环境变量覆盖）
ai.internal-key=${AI_INTERNAL_KEY:physicene-internal-2026-dev}

# Feign 超时（SD-3：agent/chat 30s）
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=35000

# 文件上传限制（SRS 4.2：10MB 白名单）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# P6 Flyway：V1=基线 schema（14 表快照）/ V2=种子（admin+demo+OCR）；V3+ 起为正式演进
# baseline-on-migrate：已存在的库在 baseline-version=2 处打基线（跳过 V1/V2=已在），V3+ 全库统一生效
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
