# PhysiScene 一键启动（P2 · 2026-10-12）：4 服务——mysql/backend/ai/frontend
# 用法：cp .env.example .env（改密码）→ docker compose up -d → 打开 http://localhost
# 本地受限网络验证用 override（docker-compose.override.yml，已 gitignore）：
#   frontend target=runtime（宿主先 pnpm build）+ backend RUNTIME_BASE=maven 镜像 + 国内源 ARG

services:
  mysql:
    image: mysql:8.0
    container_name: physicene-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [physicene]

  backend:
    build:
      context: ./java-backend
    container_name: physicene-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 与 application.properties 默认同参（utf8mb4 + 上海时区 + 允许首次握手取公钥）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-physicene-dev-secret-0123456789abcdef-0123456789abcdef-0123456789}
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY:-physicene-internal-2026-dev}
      AI_SERVICE_URL: http://ai:8000
      TZ: Asia/Shanghai
    healthcheck:
      # wget(alpine)/curl(部分基底)/bash /dev/tcp(ubuntu) 三级兜底——RUNTIME_BASE 可换时双基底都过
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health 2>/dev/null || curl -fsS http://localhost:8080/actuator/health 2>/dev/null || bash -c '</dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s   # P4 实测：MySQL 首次初始化 ~60s 吃掉观察窗致误判 unhealthy，放宽
    networks: [physicene]

  ai:
    build:
      context: ./python-ai-service
      target: ${AI_MODE:-slim}
    container_name: physicene-ai
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 注意：Python 侧变量名是 INTERNAL_KEY（Java 侧才叫 AI_INTERNAL_KEY——P0 调研勘误）
      INTERNAL_KEY: ${AI_INTERNAL_KEY:-physicene-internal-2026-dev}
      # Agent 工具回调 Java 用容器服务名
      JAVA_BASE_URL: http://backend:8080
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [physicene]

  frontend:
    build:
      context: ./frontend
    container_name: physicene-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [physicene]

volumes:
  mysql-data:
    name: physicene-mysql-data

networks:
  physicene:
    name: physicene-net
    driver: bridge
