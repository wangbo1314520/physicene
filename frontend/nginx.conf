# PhysiScene 前端容器：SPA 静态 + /api /ws 反代到 backend 容器（Docker 内网服务名）
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # OCR 上传走 multipart（后端限 10MB，nginx 默认 1m 会先拦）——必须放大
  client_max_body_size 12m;

  # SPA history 模式 fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 反代目标用变量 + docker 内建 DNS（127.0.0.11）——请求时解析：
  # nginx 启动不依赖 backend 存活（proxy_pass 常量主机名会在启动期解析 DNS，
  # backend 未起时 nginx 直接 emerg 退出——实测踩坑 2026-10-12）
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8080;

  # API 反代（前端 axios baseURL=/api 相对路径 → 同源；变量式不带 URI=原样转发 /api/...）
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;   # AI 问答（DeepSeek 最长 ~60s）
  }

  # 仿真 WebSocket 反代
  location /ws/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;  # 长仿真常驻连接
    proxy_send_timeout 3600s;
  }

  # 静态资源缓存（vite 产物带内容 hash，可久存）
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
