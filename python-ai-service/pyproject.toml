[project]
name = "physicene-ai"
version = "0.1.0"
description = "PhysiScene Python AI 服务：Agent 对话 / RAG / OCR（FastAPI + LangChain + DeepSeek）"
authors = [{ name = "wangbo" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "loguru>=0.7",
    "httpx (>=0.28.1,<0.29.0)",
    "openai (>=3.13.0,<4.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "physicene_ai", from = "src" }]

# 国内镜像加速（仅本服务依赖安装，不影响全局 pip）
[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
